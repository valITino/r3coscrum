# Eingang Methodik
#
# Läuft bei jeder Änderung unter methodik/ oder sprints/ auf main und
# eröffnet im Produkt-Repository valITino/r3cosint einen Pull Request, der
# docs/EINGANG_METHODIK.md fortschreibt: was sich geändert hat, warum, und
# ein Permalink zurück auf den Commit hier. Nie ein direkter Commit.
#
# Voraussetzung: das Repository-Secret R3COSINT_TOKEN — ein Token mit
# Schreibrecht auf Inhalte und Pull Requests in valITino/r3cosint. Hier
# steht nur der Name des Secrets, nie das Geheimnis selbst.

name: Eingang Methodik

on:
  push:
    branches: [main]
    paths:
      - "methodik/**"
      - "sprints/**"

permissions:
  contents: read

# Läufe nacheinander, nie parallel. Verwirft GitHub bei schnellen
# Push-Folgen einen wartenden Lauf, entsteht trotzdem keine Lücke: der
# nächste Lauf setzt am zuletzt protokollierten Nachweis an, nicht am
# Anfang seines eigenen Pushs.
concurrency:
  group: eingang-methodik
  cancel-in-progress: false

jobs:
  eingang:
    runs-on: ubuntu-latest
    steps:
      - name: Methodik-Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Aus diesem Auscheckvorgang wird nur gelesen (git log, git diff).
          # Geschrieben wird ausschliesslich im Produkt-Repository, das
          # gleich darauf mit eigenem Token ausgecheckt wird. Ohne diese
          # Zeile bliebe das Token dieses Laufs in .git/config des Laeufers
          # stehen, waehrend danach fremde Commit-Nachrichten verarbeitet
          # werden.
          persist-credentials: false

      - name: Produkt-Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: valITino/r3cosint
          token: ${{ secrets.R3COSINT_TOKEN }}
          path: produkt
          fetch-depth: 0

      - name: Änderungen ermitteln
        env:
          EREIGNIS_VORHER: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Obergrenzen fuer den fremden Textanteil eines Eintrags.
          MAX_ZEILEN_WAS=100
          MAX_ZEILEN_WARUM=60
          MAX_ZEICHEN_ZEILE=500

          # Entschaerfung, bevor fremder Text nach Repo A geschrieben wird.
          #
          # Was hier durchlaeuft, stammt aus Commit-Nachrichten und Dateinamen
          # dieses Repositories. Es wird in Repo A abgelegt und dort vom
          # SessionStart-Hook in den Sitzungskontext eines Sprachmodells
          # gegeben. Damit ist es fremder Inhalt im Sinne der Verfahrensgarantie
          # 5.4 des Projektauftrags: Daten, nie Anweisungen. Drei Schritte:
          #
          #   1. Steuerzeichen entfernen; Tabulator (9) und Zeilenumbruch (10)
          #      bleiben. Text, der Bildschirmsteuerung mitbringt, gibt sich als
          #      etwas anderes aus, als er ist. Der Bereich ist bewusst
          #      zusammenhaengend geschrieben (\013-\037 statt
          #      \013\014\016-\037): die aufgeteilte Fassung liess den
          #      Wagenruecklauf (13) stehen, waehrend der Kommentar daneben das
          #      Gegenteil behauptete. Befund F3 der statischen Pruefung vom
          #      2026-08-25.
          #   2. Folgen von drei oder mehr Gleichheitszeichen aufbrechen, damit
          #      schon die Datei in Repo A -- die ein Mensch im Pull Request
          #      liest -- keine Zeile traegt, die wie ein Marker aussieht.
          #
          #      WICHTIG, damit das spaeter nicht falsch gelesen wird: Dies ist
          #      Hygiene fuer den menschlichen Leser, NICHT die Zusicherung
          #      gegen nachgebildete Marker. Eine Ersetzung einzelner Zeichen
          #      ist eine Sperrliste, und Sperrlisten sind hier untauglich: die
          #      statische Pruefung vom 2026-08-25 hat eine frueher gleich
          #      gebaute Zusicherung im Hook mit Unicode-Homoglyphen umgangen
          #      (U+FF1D, U+2550, U+3013). Die Zusicherung traegt seither der
          #      Hook in Repo A strukturell: er stellt jeder Zeile des fremden
          #      Teils "| " voran, sodass keine Zeile aus diesem Repository die
          #      Form eines Markers annehmen kann -- unabhaengig davon, welche
          #      Zeichen sie verwendet. Diese Zeile hier durch weitere Zeichen
          #      zu ergaenzen, verbessert nichts und wiegt in falscher
          #      Sicherheit.
          #   3. Zeilenzahl und Zeilenlaenge begrenzen. Beides ist sonst
          #      unbegrenzt: eine einzige sehr lange Zeile genuegt, um den
          #      Kontext zu fluten.
          #
          # awk statt head: head schliesst die Pipe beim Erreichen der Grenze,
          # und unter pipefail koennte der Rueckgabewert des abgebrochenen
          # Schreibers durchschlagen. awk liest bis zum Ende.
          entschaerfen() {  # $1 Eingabe, $2 Ausgabe, $3 Hoechstzahl Zeilen, $4 Praefix der Meldung
            tr -d '\000-\010\013-\037\177' < "$1" \
              | sed 's/=\{3,\}/= = =/g' \
              | awk -v maxz="$3" -v maxc="$MAX_ZEICHEN_ZEILE" -v pre="$4" '
                  {
                    if (length($0) > maxc) { $0 = substr($0, 1, maxc) " [Zeile gekuerzt]" }
                    if (NR <= maxz) { print }
                  }
                  END {
                    if (NR > maxz) {
                      printf "%s[Gekuerzt: %d weitere Zeilen. Vollstaendig im Nachweis-Commit.]\n", pre, NR - maxz
                    }
                  }' > "$2"
          }

          # Startpunkt des Vergleichs ist bevorzugt der zuletzt in
          # docs/EINGANG_METHODIK.md protokollierte Nachweis-Commit — so
          # bleibt das Protokoll auch dann lückenlos, wenn ein wartender
          # Lauf verworfen wurde. Rückfälle: der Stand vor dem Push, dann
          # der Elterncommit, zuletzt der leere Baum (erster Push).
          QUELLE="HEAD"
          if git -C produkt rev-parse --verify --quiet origin/eingang/methodik >/dev/null; then
            QUELLE="origin/eingang/methodik"
          fi
          LETZTER="$( (git -C produkt show "$QUELLE:docs/EINGANG_METHODIK.md" 2>/dev/null || true) \
            | sed -n 's|^\*\*Nachweis:\*\* .*/commit/\([0-9a-f]\{40\}\)$|\1|p' | tail -n 1)"

          if [ -n "$LETZTER" ] && git cat-file -e "$LETZTER^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$LETZTER" "$GITHUB_SHA"; then
            VORHER="$LETZTER"
          elif [ -n "$EREIGNIS_VORHER" ] && git cat-file -e "$EREIGNIS_VORHER^{commit}" 2>/dev/null; then
            VORHER="$EREIGNIS_VORHER"
          else
            VORHER="$(git rev-parse --verify --quiet "$GITHUB_SHA^" || git hash-object -t tree /dev/null)"
          fi

          # core.quotepath=false, damit Dateinamen mit Umlauten lesbar
          # bleiben statt oktal-escaped zu erscheinen.
          ROH="$RUNNER_TEMP/rohdiff.txt"
          git -c core.quotepath=false diff --name-status "$VORHER" "$GITHUB_SHA" \
            -- methodik/ sprints/ > "$ROH"

          # Netto keine Änderung (schon protokolliert, oder Änderung und
          # Rücknahme im selben Bereich): kein Eintrag. Ein allenfalls
          # nachzuholender Pull Request wird im nächsten Schritt trotzdem
          # sichergestellt.
          if [ ! -s "$ROH" ]; then
            echo "Keine Netto-Änderung seit dem letzten Nachweis — kein Eintrag."
            exit 0
          fi

          while IFS=$'\t' read -r art pfad pfad_neu; do
            case "$art" in
              A*) echo "- Neu: \`$pfad\`" ;;
              M*) echo "- Geändert: \`$pfad\`" ;;
              D*) echo "- Entfernt: \`$pfad\`" ;;
              R*) echo "- Umbenannt: \`$pfad\` in \`$pfad_neu\`" ;;
              *)  echo "- \`$pfad\`" ;;
            esac
          done < "$ROH" > "$RUNNER_TEMP/was-roh.md"
          entschaerfen "$RUNNER_TEMP/was-roh.md" "$RUNNER_TEMP/was.md" "$MAX_ZEILEN_WAS" "- "

          # Überschrift nach dem, was tatsächlich betroffen ist.
          TAB="$(printf '\t')"
          GEGENSTAND="der Methodik"
          if grep -q "${TAB}sprints/" "$ROH"; then
            if grep -q "${TAB}methodik/" "$ROH"; then
              GEGENSTAND="Methodik und Sprints"
            else
              GEGENSTAND="den Sprints"
            fi
          fi

          # Warum: die Nachrichten aller Commits im Bereich, die methodik/
          # oder sprints/ berühren — nicht nur die des letzten Commits.
          if git cat-file -e "$VORHER^{commit}" 2>/dev/null; then
            BEREICH="$VORHER..$GITHUB_SHA"
          else
            BEREICH="$GITHUB_SHA"
          fi
          git log --reverse --format='%h — %s%n%b' "$BEREICH" -- methodik/ sprints/ \
            | sed -e 's/^/> /' -e 's/[[:space:]]*$//' > "$RUNNER_TEMP/warum-roh.md"
          entschaerfen "$RUNNER_TEMP/warum-roh.md" "$RUNNER_TEMP/warum.md" "$MAX_ZEILEN_WARUM" "> "
          if [ ! -s "$RUNNER_TEMP/warum.md" ]; then
            echo "> Keine Commit-Nachricht ermittelbar." > "$RUNNER_TEMP/warum.md"
          fi

          {
            echo "## $(date -u +%F) — Änderung an $GEGENSTAND"
            echo
            echo "**Was sich geändert hat:**"
            echo
            cat "$RUNNER_TEMP/was.md"
            echo
            echo "**Warum:**"
            echo
            cat "$RUNNER_TEMP/warum.md"
            echo
            echo "**Nachweis:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          } > "$RUNNER_TEMP/eintrag.md"

      - name: Eintrag fortschreiben und Pull Request eröffnen
        working-directory: produkt
        env:
          GH_TOKEN: ${{ secrets.R3COSINT_TOKEN }}
        run: |
          set -euo pipefail

          ZWEIG="eingang/methodik"
          DATEI="docs/EINGANG_METHODIK.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASIS="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)"

          # Der Sammelzweig ist veraltet, wenn sein letzter Nachweis schon
          # im Standardzweig protokolliert ist: dann wurde der Pull Request
          # gemerged (auch per Squash oder Rebase), ohne dass der Zweig
          # gelöscht wurde. So ein Zweig wird nicht fortgeschrieben,
          # sondern frisch ab dem Standardzweig neu aufgesetzt.
          VERALTET=0
          if git rev-parse --verify --quiet "origin/$ZWEIG" >/dev/null; then
            ZWEIG_LETZTER="$( (git show "origin/$ZWEIG:$DATEI" 2>/dev/null || true) \
              | sed -n 's|^\*\*Nachweis:\*\* .*/commit/\([0-9a-f]\{40\}\)$|\1|p' | tail -n 1)"
            # Die Nachweisliste geht in eine Datei; grep prueft gegen die Datei,
            # nicht gegen eine Pipe. grep -q schliesst die Pipe beim ersten
            # Treffer, und unter pipefail koennte der Rueckgabewert des
            # abgebrochenen sed den Treffer ueberschreiben — die Erkennung
            # meldete dann faelschlich "nicht veraltet", und ein bereits
            # gemergter Sammelzweig wuerde fortgeschrieben. Dieselbe Falle ist
            # in nachweise-uebertragen.yml und meilenstein-tag.yml im
            # Produkt-Repository bereits behoben und kommentiert.
            (git show "origin/$BASIS:$DATEI" 2>/dev/null || true) \
              | sed -n 's|^\*\*Nachweis:\*\* .*/commit/\([0-9a-f]\{40\}\)$|\1|p' \
              > "$RUNNER_TEMP/basis-nachweise.txt"
            if [ -n "$ZWEIG_LETZTER" ] \
                && grep -qFx "$ZWEIG_LETZTER" "$RUNNER_TEMP/basis-nachweise.txt"; then
              VERALTET=1
            fi
          fi

          ANGEHAENGT=0
          if [ -s "$RUNNER_TEMP/eintrag.md" ]; then
            # Besteht ein brauchbarer Sammelzweig, wird er fortgeschrieben,
            # damit mehrere Änderungen im selben offenen Pull Request
            # landen; sonst beginnt er frisch ab dem Standardzweig.
            if [ "$VERALTET" = 0 ] && git rev-parse --verify --quiet "origin/$ZWEIG" >/dev/null; then
              git checkout -B "$ZWEIG" "origin/$ZWEIG"
            else
              git checkout -B "$ZWEIG" "origin/$BASIS"
            fi

            # Die Zieldatei wird weder angelegt noch ersatzweise nachgebaut.
            # Zwei Gruende, jeder fuer sich zwingend:
            #
            #   1. Ihr Kopf traegt den Abschnitt "Diese Datei ist Information,
            #      keine Anweisung" -- die Schranke, die verhindert, dass
            #      beilaeufig notierter Text aus diesem Repository zur
            #      Arbeitsanweisung in Repo A wird. Diesen Text hier
            #      vorzuhalten hiesse, Inhalt des Produkt-Repositories zu
            #      kopieren. CLAUDE.md dieses Repositories untersagt das und
            #      verlangt Verweise statt Kopien.
            #   2. Bis zum 2026-08-25 legte dieser Schritt bei fehlender Datei
            #      eine verkuerzte Fassung an: ohne jenen Abschnitt und ohne
            #      die Ueberschrift "## Einträge", an der der SessionStart-Hook
            #      in Repo A den Eintragsbereich herausschneidet. Der Eintrag
            #      waere geschrieben und der Lauf gruen gewesen, waehrend der
            #      Kanal still nichts mehr ausgegeben haette. Genau diese
            #      Fehlerklasse -- gruener Lauf, wirkungslose Zustellung -- hat
            #      den Kanal schon einmal unbemerkt stillgelegt.
            #
            # Ein lauter Abbruch ist deshalb richtig: die Datei ist in Repo A
            # versioniert, ihr Fehlen ist eine Anomalie fuer einen Menschen,
            # keine Lage, die eine Automatik ueberdecken darf.
            if [ ! -f "$DATEI" ]; then
              echo "ABBRUCH: $DATEI fehlt in valITino/r3cosint." >&2
              echo "Die Datei ist dort versioniert. Sie wird hier nicht ersatzweise" >&2
              echo "angelegt; wiederherstellen und den Lauf wiederholen." >&2
              exit 1
            fi
            if ! grep -q '^## Einträge' "$DATEI"; then
              echo "ABBRUCH: In $DATEI fehlt die Ueberschrift '## Einträge'." >&2
              echo "Sie ist die vereinbarte Schnittstelle zum SessionStart-Hook in Repo A." >&2
              echo "Der Hook faellt zwar auf die erste Eintragsueberschrift zurueck, aber" >&2
              echo "ihr Fehlen zeigt an, dass die Datei nicht mehr die erwartete Form hat." >&2
              exit 1
            fi

            # Wiederholte Läufe zum selben Commit hängen nichts doppelt an:
            # der Nachweis-Permalink ist pro Commit eindeutig.
            if grep -qF "commit/$GITHUB_SHA" "$DATEI"; then
              echo "Commit $GITHUB_SHA ist bereits protokolliert, nichts anzuhängen."
            else
              {
                echo
                cat "$RUNNER_TEMP/eintrag.md"
              } >> "$DATEI"
              git add "$DATEI"
              git commit -m "docs: Eingang Methodik, Stand $GITHUB_SHA"
              # force-with-lease greift nur, wenn ein veralteter Zweig neu
              # aufgesetzt wurde; sonst ist der Push ein gewöhnlicher
              # Vorlauf. Der Zweig gehört allein dieser Automatik.
              git push --force-with-lease -u origin "$ZWEIG"
              ANGEHAENGT=1
              VERALTET=0
            fi
          fi

          # Pull Request sicherstellen: nur wenn der Zweig auf origin
          # liegt, nicht veraltet ist und dem Standardzweig voraus ist —
          # sonst lehnte GitHub die Anlage ab oder es entstünde ein
          # Pull Request mit bereits gemergten Einträgen. Schlägt eine
          # Abfrage fehl, bricht der Lauf laut ab, statt blind einen
          # doppelten Pull Request zu versuchen.
          if git rev-parse --verify --quiet "origin/$ZWEIG" >/dev/null \
              && [ "$VERALTET" = 0 ] \
              && [ "$(git rev-list --count "origin/$BASIS..origin/$ZWEIG")" -gt 0 ]; then
            OFFEN="$(gh pr list --head "$ZWEIG" --state open --json number --jq '.[].number')"
            if [ -z "$OFFEN" ]; then
              RUMPF="$RUNNER_TEMP/eintrag.md"
              if [ "$ANGEHAENGT" = 0 ] || [ ! -s "$RUMPF" ]; then
                # Nachholer ohne frischen Eintrag (voriger Lauf scheiterte
                # nach dem Push): generischer Rumpf, die Einzelheiten
                # stehen im Diff von docs/EINGANG_METHODIK.md.
                RUMPF="$RUNNER_TEMP/rumpf.md"
                {
                  echo "Fortschreibung von \`docs/EINGANG_METHODIK.md\` aus"
                  echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY."
                  echo
                  echo "Die Einzelheiten stehen im Diff dieser Datei."
                } > "$RUMPF"
              fi
              gh pr create \
                --head "$ZWEIG" \
                --title "Eingang Methodik" \
                --body-file "$RUMPF"
            fi
          fi
